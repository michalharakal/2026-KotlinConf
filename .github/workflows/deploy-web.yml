name: Deploy web demo to GitHub Pages

# Builds the Compose/WebAssembly transformer demo (:webApp) into a static site and
# publishes it to GitHub Pages. Deploys only from the default branch — merge to main to
# publish. (Pages Source must be "GitHub Actions"; the github-pages environment allows main.)
on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Least-privilege token that can publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Gradle build configures :androidApp, which needs an Android SDK present.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the WebAssembly distribution
        working-directory: code
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      # GitHub Pages runs Jekyll by default; .nojekyll serves the wasm bundle verbatim.
      - name: Disable Jekyll
        run: touch code/webApp/build/dist/wasmJs/productionExecutable/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
